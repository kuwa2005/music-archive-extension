<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲制作アーカイブ</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/theme.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>楽曲制作アーカイブ</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="ライトモードに切替（電球を点灯）" title="ライトモード">
        <svg class="bulb-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path class="bulb-glass" d="M12 2a5.5 5.5 0 0 0-5.5 5.5c0 1.9-.5 2.9-1.2 3.8-.4.5-.4 1.2 0 1.7l.4.4h12.6l.4-.4c.4-.5.4-1.2 0-1.7-.7-.9-1.2-1.9-1.2-3.8A5.5 5.5 0 0 0 12 2z"/>
          <rect class="bulb-base" x="9" y="17" width="6" height="2" rx="0.5"/>
          <rect class="bulb-base" x="10" y="19.5" width="4" height="1.5" rx="0.5"/>
        </svg>
      </button>
    </div>
    <p id="count-label">読み込み中…</p>
  </header>
  <main>
    <button id="save-current" type="button">現在のページを保存</button>
    <button id="open-dashboard" type="button" class="secondary">検索ダッシュボード</button>
  </main>
  <footer>
    <label><input type="checkbox" id="auto-suno"> Suno 自動保存</label>
    <label><input type="checkbox" id="auto-ai"> AI チャット自動保存</label>
    <label><input type="checkbox" id="auto-list"> リスト自動保存</label>
  </footer>
  <script src="../../dist/popup.js"></script>
</body>
</html>
