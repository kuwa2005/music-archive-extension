<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>楽曲制作アーカイブ</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/modal.css">
  <link rel="stylesheet" href="../shared/dialog.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>楽曲制作アーカイブ</h1>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-label="ライトモードに切替（太陽）" title="ライトモード">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
    <p id="count-label">読み込み中…</p>
  </header>
  <main>
    <button id="save-current" type="button">現在のページを保存</button>
    <button id="open-dashboard" type="button" class="secondary">検索ダッシュボード</button>
  </main>
  <div id="message-dialog" class="modal message-dialog" hidden>
    <div class="modal-backdrop" data-message-dialog-backdrop></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="message-dialog-title">
      <header class="modal-header">
        <h2 id="message-dialog-title">お知らせ</h2>
        <button id="message-dialog-close-btn" type="button" class="icon-btn" aria-label="閉じる">×</button>
      </header>
      <div class="modal-body">
        <p id="message-dialog-text" class="message-dialog-text"></p>
      </div>
      <footer class="modal-footer">
        <button id="message-dialog-ok" type="button">OK</button>
        <button id="message-dialog-cancel" type="button" class="secondary" hidden>キャンセル</button>
      </footer>
    </div>
  </div>

  <script src="../../dist/popup.js"></script>
</body>
</html>
